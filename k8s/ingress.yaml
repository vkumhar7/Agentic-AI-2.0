apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: risk-analysis-api
spec:
  rules:
    - host: risk-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: risk-analysis-api
                port:
                  number: 80
