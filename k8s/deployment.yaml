apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-analysis-api
  labels:
    app: risk-analysis-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-analysis-api
  template:
    metadata:
      labels:
        app: risk-analysis-api
    spec:
      containers:
        - name: api
          image: your-registry/risk-analysis-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
